[project]
name = "lux-terminal-spike"
version = "0.0.0"
description = "Spike: libghostty-vt terminal element for the Lux ImGui display"
requires-python = ">=3.13"
dependencies = [
    "pyghostty==0.1.4",       # pinned exactly: we use its low-level _ffi layer
    "pyte>=0.8.2",            # baseline engine (imgui_bundle.imgui_terminal)
    "imgui-bundle==1.92.900", # same pin as lux
    "numpy>=2.0.0",           # lux [display] already ships numpy
    "Pillow>=12.0",           # screenshots (also in lux [display])
]

[dependency-groups]
dev = ["ruff>=0.8", "mypy>=1.14"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
check_untyped_defs = true
ignore_missing_imports = true
