name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          enable-cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: uv sync --locked --extra display
      - run: uv run --extra display ruff check .
      - run: uv run --extra display ruff format --check .
      - run: uv run --extra display mypy src/ tests/
      - run: uv run --extra display pyright src/ tests/
      # The plugin surface has to stand alone: a marketplace install fetches
      # only plugin/, so a path resolving outside it passes every check above
      # — they run against the full tree, where the target is present — and
      # breaks on every installed copy. Neither of these ran in CI before.
      - run: bash scripts/check-plugin-surface.sh
      - run: bash scripts/check-skill-permissions.sh
