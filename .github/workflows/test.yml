name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          enable-cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: uv sync --locked --extra display
      - name: Unit tests (excludes the characterization corpus)
        run: uv run --extra display pytest --ignore=tests/characterization
      - name: Snapshot parity (characterization corpus must replay byte-for-byte)
        run: make snapshot-parity

  # Tier-2 integration + e2e gate. `make test-integration` runs `pytest -m integration`,
  # which includes the tests/e2e/ business-event-loop harness (marked @pytest.mark.integration)
  # — the standing gate against the illusion of progress. The integration tier needs no GPU
  # and no display process, so it runs headless as-is. BLOCKING in CI: no continue-on-error,
  # so a failure fails this check run. To gate merges, `integration` must be listed in main's
  # required status checks (branch-protection settings) — the YAML alone cannot make it required.
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          enable-cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: uv sync --locked --extra display
      - name: Integration + e2e tests (pytest -m integration, includes tests/e2e/)
        run: make test-integration

  # Slow / timing-sensitive class (@pytest.mark.slow): frame-budget smoke +
  # probe-responsiveness. These assert absolute wall-clock bounds that track machine
  # load, not code — deliberately quarantined out of the gating path. This job
  # runs them for visibility/anti-rot only. NON-BLOCKING: continue-on-error means a rare
  # timing hiccup on a loaded runner surfaces but never gates a merge.
  slow:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          enable-cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: uv sync --locked --extra display
      - name: Slow / timing-sensitive tests (pytest -m slow, non-blocking)
        run: make test-slow

  # Tier-3 e2e gate (lux-csjb). `make test-e2e` (pytest -m e2e) drives the real
  # `make restart` sequence -- a real `uv build` + `uv tool install`, then
  # `lux hub install` / `lux display install`, which regenerate the launchd
  # plists -- against a live launchd GUI domain (`gui/<uid>`). launchd exists
  # only on Darwin, so this class of defect is invisible to the ubuntu-latest
  # `test`/`integration`/`slow` jobs above: lux-j169 renamed the hub disk binary
  # and the Makefile's `restart` target kept calling `launchctl kickstart -k`,
  # which never rewrites a plist, so it hung forever against the deleted binary
  # path -- and shipped unnoticed because no CI job ever exercised the real
  # launchd install path. `make install` runs before pytest so ~/.local/bin is
  # populated before test collection, independent of pytest's file collection
  # order between test_install_matches_pyproject.py and test_make_restart.py
  # (the latter performs its own install as part of the test body; the former
  # only asserts binaries already exist). BLOCKING: a hung `make restart` on
  # the operator's machine is exactly the failure class this job exists to
  # catch before merge.
  e2e-macos:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          enable-cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: uv sync --locked --extra display
      - name: Put uv's tool bin dir on PATH (lux/luxd-hub/luxd-display, shelled out to by tests/e2e/)
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Pre-install so ~/.local/bin is populated before pytest collects tests/e2e/
        run: make install
      - name: E2E tests (real make-restart sequence, launchd plist install/verify)
        run: make test-e2e
