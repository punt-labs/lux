name: Ratchets

# Closes the gap that let #465 land a coupling regression that turned main
# red: `make check-oo` and `make check-coupling` were enforced only on a
# developer's machine (and in the local Phase-5 review pass), never in CI, so
# a PR whose ratchet was red could still satisfy the merge gate (CI-green +
# resolved threads) and merge anyway. These two jobs run the same ratchets
# `make check` runs locally, so a red ratchet fails the check run here too.
#
# RUNNING vs REQUIRED: adding these jobs makes them RUN on every PR and push
# to main. Making them REQUIRED to merge is a separate branch-protection /
# ruleset setting -- this file cannot flip that switch. The exact status
# check names to add to the ruleset are the job ids below, prefixed with this
# workflow's name (the format GitHub's branch-protection UI expects):
#   Ratchets / check-oo
#   Ratchets / check-coupling
#   Ratchets / check-layers

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check-layers:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: uv sync --locked --extra display
      - run: make check-layers

  # check-oo compares HEAD against a base baseline
  # (`git show <base>:.oo-baseline.json` -- oo_ratchet.oo.gitio
  # `resolve_base`/`show_baseline`). Which commit is "the base" differs by
  # trigger, because the two triggers answer different questions:
  #
  #   pull_request -- "did this PR regress anything?" The base is
  #   merge-base(origin/main, HEAD): the point the PR branch forked from
  #   main, so a concurrent regression landed on main by someone else's PR is
  #   correctly excluded from THIS PR's touched set, AND -- because it is the
  #   fork point, not the tip of the last commit -- a regression buried in an
  #   EARLIER commit of a multi-commit PR is still inside `base..HEAD` and
  #   still caught. `make check-oo` with no BASE_REF leaves the tool's own
  #   default (`GitRepo.resolve_base`, `oo_ratchet.oo.gitio`) untouched,
  #   which already computes exactly that merge-base -- so the PR trigger
  #   passes no override at all; there is nothing to widen.
  #
  #   push -- "is main green after this landed?" This is the defense-in-depth
  #   net for the merge-produces-red case the PR trigger can miss (#465):
  #   a PR can be individually green yet, once merged, `main` at HEAD carries
  #   a regression neither side's merge-base comparison alone would catch.
  #   On push, HEAD *is* the new origin/main -- merge-base(origin/main, HEAD)
  #   == HEAD, an empty diff, so the merge-base default is VACUOUS here: it
  #   silently reports "No Python files touched" without scoring anything the
  #   push changed (qodo finding on PR #467, scenario 1). The fix is to
  #   compare against `github.event.before` (the pre-push tip of main)
  #   instead: `make check-oo BASE_REF=<before-sha>` passes
  #   `--base-ref <before-sha> --require-base` (oo_ratchet.oo.cli
  #   already exposes `--base-ref`; only the Makefile plumbing was missing).
  #   `--require-base` makes an unresolvable base a hard failure rather than
  #   a silent bootstrap-pass, matching "genuinely verify main is green."
  #
  # The default actions/checkout is a shallow, single-branch clone: it does
  # not fetch `origin/main` at all (not merely a short history -- the ref is
  # absent), so `git merge-base origin/main HEAD` fails with "unknown
  # revision" and the ratchet fails closed ("cannot resolve merge-base
  # (origin/main unfetched or stale)"). `fetch-depth: 0` makes
  # actions/checkout do a full, unshallow fetch of every branch and tag,
  # which is what actually populates `refs/remotes/origin/main` -- confirmed
  # locally by cloning this repo with `git clone --depth 1` (origin/main
  # absent, merge-base fails) and then `git fetch --unshallow origin
  # '+refs/heads/*:refs/remotes/origin/*'` (origin/main present, merge-base
  # resolves). It also fetches `github.event.before`'s commit whenever that
  # commit is an ancestor of the pushed history, which it is for the normal
  # fast-forward push this repo's branch protection produces. The explicit
  # `git fetch origin main` step below is belt-and-suspenders: fetch-depth: 0
  # already covers it, but if a future edit narrows the checkout back down,
  # this step keeps origin/main resolvable without silently reintroducing the
  # gotcha.
  check-oo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0
      - name: Fetch origin/main (merge-base target for the OO ratchet)
        run: git fetch origin main
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: uv sync --locked --extra display
      # Root cause of the push-trigger startup_failure this step's `name:`
      # used to carry (confirmed with `uvx --from actionlint-py actionlint`,
      # which failed pure YAML parsing -- "mapping values are not allowed in
      # this context" -- at the colon in `(push: ...)`): a plain (unquoted)
      # YAML scalar cannot contain a bare ": " -- colon immediately followed
      # by a space -- because that sequence is indistinguishable from a
      # mapping key/value separator. `Run OO ratchet (push: base-compare ...;
      # PR: merge-base default)` has two such sequences ("push: " and "PR:
      # "), so GitHub could not parse the workflow file at all: every push
      # run against main showed zero jobs (a true startup_failure, not a job
      # failure) because the file was rejected before any job was scheduled.
      # It surfaced as push-only because the last `pull_request` CI run
      # before merge (374bfa2c) predated this text -- these two comment-heavy
      # step names were added in a later commit within #467, and ratchets.yml
      # was not yet a REQUIRED status check (see the header comment above),
      # so the PR could merge without a fresh green run ever validating the
      # final content. Fix: quote the `name:` scalar.
      - name: "Run OO ratchet (push: base-compare against pre-push main; PR: merge-base default)"
        # `github.event.before` (the push event's pre-push tip) is read via
        # `env:`, not spliced inline as `${{ }}` into the run script body.
        # GitHub renders every `${{ }}` expression in a `run:` block at
        # template time, unconditionally, regardless of which shell branch
        # ends up executing -- so an inline expression here is live on every
        # trigger this workflow listens to, not just push. `env:` keeps the
        # raw event text out of the script text entirely (the hardening this
        # repo's org standard already asks for -- see GitHub's guidance on
        # script-injection risk from unsanitized `${{ }}` in `run:` bodies)
        # and degrades safely to an empty string on `pull_request`, where
        # `before` is absent from the event payload.
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "push" ] && [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            make check-oo BASE_REF="$BEFORE_SHA"
          else
            make check-oo
          fi

  # The package compares coupling against the baseline committed at the base.
  # PRs use merge-base(origin/main, HEAD); pushes use github.event.before so
  # the entire push is checked even after origin/main has advanced to HEAD.
  # Keep the full history and origin/main fetch for both comparison modes.
  check-coupling:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0
      - name: Fetch origin/main (merge-base target for the coupling ratchet)
        run: git fetch origin main
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: uv sync --locked --extra display
      # Same quoting fix as check-oo's step above, and for the identical
      # reason: this `name:` scalar also carried two unquoted ": " sequences
      # ("push: " and "PR: "), which is invalid in plain YAML and is what
      # actually caused the push-trigger startup_failure (confirmed with
      # `actionlint`'s YAML syntax-check, not a `github.event.before` context
      # issue). See the longer note on the check-oo step above.
      - name: "Run coupling ratchet (push: whole-push touched-file range; PR: whole-PR touched-file range)"
        # `github.event.before` read via `env:`, not inline `${{ }}` in the
        # run script -- see the check-oo step above for why.
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            if [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
              make check-coupling BASE_REF="$BEFORE_SHA"
            else
              make check-coupling
            fi
          else
            BASE_REF="$(git merge-base origin/main HEAD)"
            make check-coupling BASE_REF="$BASE_REF"
          fi

      # Advisory only: publish the verdict or input error even after a gate
      # fails, without letting a reporting failure gate this job.
      - name: Design ratchet (shadow, report only)
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        continue-on-error: true
        env:
          DESIGN_BASE: origin/${{ github.base_ref }}
        run: |
          {
            echo '### Design ratchet (shadow, report only)'
            echo '```text'
            make design-shadow 2>&1 || true
            echo '```'
          } | tee -a "${GITHUB_STEP_SUMMARY}"
