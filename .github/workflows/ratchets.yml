name: Ratchets

# Closes the gap that let #465 land a coupling regression that turned main
# red: `make check-oo` and `make check-coupling` were enforced only on a
# developer's machine (and in the local Phase-5 review pass), never in CI, so
# a PR whose ratchet was red could still satisfy the merge gate (CI-green +
# resolved threads) and merge anyway. These two jobs run the same ratchets
# `make check` runs locally, so a red ratchet fails the check run here too.
#
# RUNNING vs REQUIRED: adding these jobs makes them RUN on every PR and push
# to main. Making them REQUIRED to merge is a separate branch-protection /
# ruleset setting -- this file cannot flip that switch. The exact status
# check names to add to the ruleset are the job ids below, prefixed with this
# workflow's name (the format GitHub's branch-protection UI expects):
#   Ratchets / check-oo
#   Ratchets / check-coupling

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # check-oo compares HEAD against a base baseline
  # (`git show <base>:.oo-baseline.json` -- tools/oo_ratchet/gitio.py
  # `resolve_base`/`show_baseline`). Which commit is "the base" differs by
  # trigger, because the two triggers answer different questions:
  #
  #   pull_request -- "did this PR regress anything?" The base is
  #   merge-base(origin/main, HEAD): the point the PR branch forked from
  #   main, so a concurrent regression landed on main by someone else's PR is
  #   correctly excluded from THIS PR's touched set, AND -- because it is the
  #   fork point, not the tip of the last commit -- a regression buried in an
  #   EARLIER commit of a multi-commit PR is still inside `base..HEAD` and
  #   still caught. `make check-oo` with no BASE_REF leaves the tool's own
  #   default (`GitRepo.resolve_base`, `tools/oo_ratchet/gitio.py`) untouched,
  #   which already computes exactly that merge-base -- so the PR trigger
  #   passes no override at all; there is nothing to widen.
  #
  #   push -- "is main green after this landed?" This is the defense-in-depth
  #   net for the merge-produces-red case the PR trigger can miss (#465):
  #   a PR can be individually green yet, once merged, `main` at HEAD carries
  #   a regression neither side's merge-base comparison alone would catch.
  #   On push, HEAD *is* the new origin/main -- merge-base(origin/main, HEAD)
  #   == HEAD, an empty diff, so the merge-base default is VACUOUS here: it
  #   silently reports "No Python files touched" without scoring anything the
  #   push changed (qodo finding on PR #467, scenario 1). The fix is to
  #   compare against `github.event.before` (the pre-push tip of main)
  #   instead: `make check-oo BASE_REF=<before-sha>` passes
  #   `--base-ref <before-sha> --require-base` (tools/oo_ratchet/cli.py
  #   already exposes `--base-ref`; only the Makefile plumbing was missing).
  #   `--require-base` makes an unresolvable base a hard failure rather than
  #   a silent bootstrap-pass, matching "genuinely verify main is green."
  #
  # The default actions/checkout is a shallow, single-branch clone: it does
  # not fetch `origin/main` at all (not merely a short history -- the ref is
  # absent), so `git merge-base origin/main HEAD` fails with "unknown
  # revision" and the ratchet fails closed ("cannot resolve merge-base
  # (origin/main unfetched or stale)"). `fetch-depth: 0` makes
  # actions/checkout do a full, unshallow fetch of every branch and tag,
  # which is what actually populates `refs/remotes/origin/main` -- confirmed
  # locally by cloning this repo with `git clone --depth 1` (origin/main
  # absent, merge-base fails) and then `git fetch --unshallow origin
  # '+refs/heads/*:refs/remotes/origin/*'` (origin/main present, merge-base
  # resolves). It also fetches `github.event.before`'s commit whenever that
  # commit is an ancestor of the pushed history, which it is for the normal
  # fast-forward push this repo's branch protection produces. The explicit
  # `git fetch origin main` step below is belt-and-suspenders: fetch-depth: 0
  # already covers it, but if a future edit narrows the checkout back down,
  # this step keeps origin/main resolvable without silently reintroducing the
  # gotcha.
  check-oo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0
      - name: Fetch origin/main (merge-base target for the OO ratchet)
        run: git fetch origin main
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: uv sync --locked --extra display
      - name: Run OO ratchet (push: base-compare against pre-push main; PR: merge-base default)
        run: |
          BEFORE="${{ github.event_name == 'push' && github.event.before || '' }}"
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            make check-oo BASE_REF="$BEFORE"
          else
            make check-oo
          fi

  # check-coupling compares touched files against the IN-TREE
  # .oo-coupling-baseline.json (not a merge-base blob), so it does not share
  # check-oo's merge-base-blob gotcha -- but it still needs the full source
  # tree plus the display extra to score src/punt_lux/, so the setup mirrors
  # check-oo. Deterministic since the Tarjan/sorted-neighbor fix in #466
  # (tools/oo_coupling.py `_tarjan_scc`): neighbor iteration is sorted, not
  # raw set iteration, so PYTHONHASHSEED no longer perturbs SCC
  # discovery/return order between runs on identical source.
  #
  # "Touched files" itself has a push-vs-PR base problem of its own, for a
  # different reason than check-oo's: tools/oo_coupling.py
  # `_git_touched_files` defaults to `HEAD~1..HEAD` (the single latest
  # commit). That default is only correct when there is exactly one commit to
  # review -- it is wrong on BOTH triggers once more than one commit is in
  # play:
  #
  #   push -- a regression in an earlier commit of a multi-commit push would
  #   never appear in `HEAD~1..HEAD` and would pass trivially (qodo finding on
  #   PR #467, scenario 2). `make check-coupling BASE_REF=<before-sha>` passes
  #   `--base-ref <before-sha>`, so the diff range becomes `before..HEAD` --
  #   the whole set of commits the push landed.
  #
  #   pull_request -- the same hole, one push landing later: `HEAD~1..HEAD`
  #   only ever sees the PR's LAST commit, so a regression introduced in an
  #   earlier commit and never re-touched by a later one passes even though
  #   the PR as a whole regressed (Copilot finding on PR #467, round 2 --
  #   check-oo's already-correct merge-base default masked this because it
  #   was assumed check-coupling shared the same fix). The fix mirrors
  #   check-oo's PR-trigger base exactly: `merge-base(origin/main, HEAD)`, the
  #   PR's fork point, computed once in this job (`_git_touched_files` has no
  #   merge-base-aware default of its own the way `GitRepo.resolve_base` does
  #   for check-oo) and passed the same way as the push case --
  #   `make check-coupling BASE_REF=<merge-base-sha>`.
  #
  # Unlike check-oo this needs no `--require-base`-style hard-fail flag inside
  # the Python tool: an unresolvable `--base-ref` makes `_git_touched_files`
  # return `None`, and `check()` already treats that as "score every file in
  # the target" -- fail toward a broader check, not a silently narrower one,
  # so the tool's existing no-git fallback already does the safe thing. The
  # merge-base computation in THIS job's shell step is a different failure
  # mode -- an unresolvable `origin/main` there is a checkout/fetch problem,
  # not an absent PR history, so it fails the step loudly (default `bash -e`)
  # rather than silently falling through to `HEAD~1`.
  check-coupling:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0
      - name: Fetch origin/main (merge-base target for the coupling ratchet)
        run: git fetch origin main
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: uv sync --locked --extra display
      - name: Run coupling ratchet (push: whole-push touched-file range; PR: whole-PR touched-file range)
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            BEFORE="${{ github.event.before }}"
            if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
              make check-coupling BASE_REF="$BEFORE"
            else
              make check-coupling
            fi
          else
            BASE_REF="$(git merge-base origin/main HEAD)"
            make check-coupling BASE_REF="$BASE_REF"
          fi
