    - 'Extend the accepted model docs/dial_settlement.tex with the WRITER, which it abstracted away. Work on branch fix/lux-ghhf-details-frame-id in [REDACTED:home]/Coding/punt-labs/lux, in the main checkout; commit there. Round-10 review found that the writer path breaks S5 and A2. Silent F1 (HIGH, .tmp/missions/review-r10-silent.md): a scene write in sendall completes after a Hub request (closing set, no cause recorded). owe_ack then refuses, and _write_failed records ''display'', so a live display is charged a death and the written scene is in neither the ledger nor the carry. Silent F2 / gvr A1: the drain gives up on the socket lock (held by a writer in sendall for up to the send timeout) and reports nothing more while readable acks wait, so acked scenes are charged.'
