[project]
name = "punt-lux"
version = "0.33.1"
description = "The paintbrush for Claude. A visual output surface for AI agents — diagrams, tables, images, and interactive controls."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [
    { name = "Punt Labs" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "typer>=0.15.0,<1",
    "rich>=15,<16",
    # Floor past the fastmcp GHSA fixed in 3.4.10 (vox Dependabot alert #60).
    "fastmcp>=4.2.0,<5",
    # fastmcp-slim 3.4.10 still admits authlib 1.9.0; floor past the critical
    # advisory fixed in 1.9.1 (vox Dependabot alert #61).
    "authlib>=1.9.1",
    # luxd imports the SDK's streamable-HTTP session manager and transport
    # security settings directly. Floor past three HIGH advisories (Host/Origin
    # validation, HTTP session principal verification, cross-client task access);
    # no WS-server ceiling any more, so the cap is just the next-next major
    # (fastmcp governs the effective upper bound).
    "mcp>=2.3.0,<3",
    "mcp-types>=2.3.0,<3",
    "pydantic>=2.0.0,<3",
    "starlette>=1.3.1,<2",
    "fastapi>=0.115.0,<1",
    "uvicorn>=0.34.0",
    "punt-observe==0.1.0",
    # The persistent hub client (LuxHubClient) speaks the WebSocket listen leg;
    # uvicorn already resolves websockets for its own server protocol, so this only
    # makes the client's dependency explicit rather than pulling a new package.
    "websockets>=16.0,<18",
    # luxd itself needs its process identity ("luxd-hub") — for logs, ps,
    # Activity Monitor, and the pgrep-diff restart wait. Without this in the
    # base install, `pip install punt-lux` (no [display] extra) leaves luxd
    # running as "python3", pgrep never finds it, and `lux hub restart` hangs.
    "setproctitle>=1.3.0",
    # The personal-CA/enrollment trust package (DES-090 W7) builds and signs
    # X.509 certificates for cross-host mTLS. Floor past 42 for the
    # `cryptography.x509.verification` PolicyBuilder API; already an
    # indirect dependency via fastapi/uvicorn, made explicit because trust/
    # imports it directly.
    "cryptography>=42.0.0,<51",
]

[project.optional-dependencies]
terminal = ["pyghostty==0.1.4"]  # headless PTY owner; no GPU dependencies

display = [
    "imgui-bundle==1.92.900",
    "Pillow>=12.3.0",
    "numpy>=2.0.0",
    "pyghostty==0.1.4",  # SPIKE: terminal element (exact pin: uses its _ffi layer)
    "PyOpenGL>=3.1.0",
    "pyobjc-framework-Cocoa>=10.0; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=10.0; sys_platform == 'darwin'",
]
# Provider 2 (system.tex §"Provider 2 (Optional): AWS Private CA (Managed)",
# DES-090) is opt-in and enterprise-tier by design — most single-user
# installs never touch it, so boto3's dependency tree (botocore, s3transfer,
# jmespath, python-dateutil) stays out of the base install, exactly like the
# [display] extra keeps the GPU stack out of a headless one.
aws = [
    "boto3>=1.34.0,<2",
]

# Dev tools live in PEP 735 dependency-groups (uv-native), not
# project.optional-dependencies. Two reasons:
#   1. `uv run` installs default groups automatically — no per-invocation
#      `--group dev` or `--extra dev` flag is needed. The Makefile and CI can
#      use `uv run --extra display <tool>` and the dev tools just work.
#   2. Dev tools are not real extras of the published package. They have no
#      business appearing in `pip install punt-lux[dev]`. Dependency-groups
#      are not exposed via PyPI; they exist for the source checkout only.
[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "punt-oo-ratchet==0.4.0",
    "ruff>=0.13.0",
    "mypy>=1.18.1",
    "pyright>=1.1.400",
    "pytest>=8.4.2",
    "pytest-cov>=6.0.0",
    "markdown==3.11.3",
    "types-markdown>=3.10,<4",
    "griffelib>=2.0.2,<3",
    # boto3 backs the [aws] extra (AwsPrivateCaProvider, DES-090 Provider 2).
    # It is not a base runtime dependency (see [project.optional-dependencies]
    # above) but `make check` runs plain `uv run` with no `--extra aws`
    # thread-through, so it lives here — the dev group installs by default
    # on every `uv run` — to keep mypy/pyright/pytest exercising the real
    # boto3 client shape rather than an ignore_missing_imports stub.
    "boto3>=1.34.0,<2",
]
doclint = [
    "pydoclint==0.12.0",
    "docstring-parser-fork==0.0.16",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocstrings[python]>=1.0.8",
]

[project.scripts]
lux = "punt_lux.__main__:_entry"
luxd-hub = "punt_lux.luxd:main"
luxd-display = "punt_lux.luxd_display:DisplayEntryPoint.main"
luxd-pty = "punt_lux.ptyd.__main__:PtyEntryPoint.main"
lux-beads = "punt_lux.applets.beads:app"

[project.urls]
Homepage = "https://github.com/punt-labs/lux"
Repository = "https://github.com/punt-labs/lux"
"Bug Tracker" = "https://github.com/punt-labs/lux/issues"

[build-system]
requires = ["uv_build>=0.9.14,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "punt_lux"

[tool.oo-ratchet.coupling]
stateless-values = "any"

[tool.oo-ratchet.coupling.caps]
"src/punt_lux/operations/facade.py" = { efferent_coupling = 20 }
"src/punt_lux/tools/subscribe_tools.py" = { efferent_coupling = 20 }
"src/punt_lux/hub_composition.py" = { efferent_coupling = 20 }

[tool.ruff]
line-length = 88
target-version = "py313"
# Spike directories are self-contained uv projects with their own pyproject.toml;
# they should not be linted by the main project's ruff config.
extend-exclude = ["spikes/", ".claude"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "TID",  # flake8-tidy-imports
    "RUF",  # Ruff-specific rules
    "S",    # flake8-bandit (security)
    "BLE",  # flake8-blind-except
    "T10",  # flake8-debugger
    "T20",  # flake8-print
    "LOG",  # flake8-logging
    "G",    # flake8-logging-format
    "A",    # flake8-builtins
    "ERA",  # flake8-eradicate (commented code)
    "PIE",  # flake8-pie
    "RSE",  # flake8-raise
    "ARG",  # flake8-unused-arguments
    "RET",  # flake8-return
    "PERF", # perflint
    "PTH",  # flake8-use-pathlib
    "ISC",  # flake8-implicit-str-concat
    "FBT",  # flake8-boolean-trap
    "C90",  # mccabe complexity
]
extend-select = ["PLC0415"]

ignore = [
    "TC001",  # Move import into TYPE_CHECKING - too aggressive
    "TC003",  # Move standard lib import into TYPE_CHECKING
]

[tool.ruff.lint.per-file-ignores]
"tools/*" = ["T20", "S603", "S607", "C901", "PERF403"]
"tests/*" = ["S101", "S105", "S106", "S108", "S603", "T20", "SLF001", "ARG", "FBT", "PLC0415", "A002"]
"tests/e2e/test_legacy_sweep.py" = ["S101", "S603", "S607"]
"demos/*" = ["T20", "S311", "C901"]
"scripts/*" = ["T20", "S108", "S603", "S607", "PLC0415"]
"src/punt_lux/__main__.py" = ["T20", "FBT", "PLC0415"]
"src/punt_lux/consent.py" = ["PLC0415"]
"src/punt_lux/runtime.py" = ["S102", "BLE001"]
"src/punt_lux/config.py" = ["S607"]
"src/punt_lux/hooks.py" = ["S607"]
"src/punt_lux/display/render_loop.py" = ["PLC0415"]
"src/punt_lux/display/query_dispatcher.py" = ["PLC0415"]
"src/punt_lux/display/fonts.py" = ["PLC0415"]
"src/punt_lux/display/replica/menu_replica.py" = ["PLC0415"]
"src/punt_lux/display/replica/menu_surfaces.py" = ["PLC0415"]
"src/punt_lux/display/gl_texture.py" = ["PLC0415"]
"src/punt_lux/display/idle_screen.py" = ["PLC0415"]
"src/punt_lux/display/macos.py" = ["PLC0415"]
"src/punt_lux/cli.py" = ["T20", "FBT", "PLC0415"]
"src/punt_lux/show.py" = ["T20", "FBT", "PLC0415"]
"src/punt_lux/cli/*.py" = ["T20", "FBT", "PLC0415"]
"src/punt_lux/luxd.py" = ["PLC0415"]
"src/punt_lux/apps/beads.py" = ["PLC0415"]
"src/punt_lux/tools/server.py" = ["PLC0415"]
# FastAPI resolves the resolve_scope dependency's annotations at runtime to inject
# Request/Response, so these are runtime imports despite being annotation-only (TC002).
"src/punt_lux/rest/identity.py" = ["TC002"]
# Same reason for the /ws route: FastAPI reads the endpoint's `websocket: WebSocket`
# hint at registration to know it is the socket rather than a query parameter, so
# WebSocket is a runtime import here even though it appears only in an annotation.
"src/punt_lux/ws_transport.py" = ["TC002"]
"src/punt_lux/tools/__init__.py" = ["PLC0415"]
# Element classes use `id` as a keyword/field name throughout the protocol —
# it matches the wire format ({"kind":"text","id":...}), the spike, and 55+
# existing call sites. Shadowing the builtin is the established convention
# for this directory; A002 is suppressed for protocol/elements/ only.
"src/punt_lux/protocol/elements/*.py" = ["A002"]
"src/punt_lux/service.py" = ["S603", "S607", "PLC0415"]
"src/punt_lux/_backends.py" = ["S603", "S607"]
"src/punt_lux/_backend_launchd.py" = ["S603", "S607", "PLC0415"]
"src/punt_lux/_backend_systemd.py" = ["S603", "S607"]
"src/punt_lux/_launchctl.py" = ["S603"]
"src/punt_lux/_port_guard.py" = ["S603", "S607"]
"src/punt_lux/_legacy_sweep_launchd.py" = ["S603", "S607"]
"src/punt_lux/_legacy_sweep_systemd.py" = ["S603", "S607"]
"src/punt_lux/_shim_ownership.py" = ["S603", "S607"]
"tests/e2e/test_binary_sweep.py" = ["S101", "S603", "S607"]
# Lazy imports to break circular dependency chains in domain/protocol layers
"src/punt_lux/domain/event_handler_host.py" = ["PLC0415"]
"src/punt_lux/domain/hub/hub_interaction_dispatch.py" = ["PLC0415"]
"src/punt_lux/domain/hub/element_index.py" = ["PLC0415"]
"src/punt_lux/domain/hub/builtin_callbacks.py" = ["PLC0415"]
"src/punt_lux/protocol/element_factory.py" = ["PLC0415"]
"src/punt_lux/protocol/elements/dialog_codec.py" = ["PLC0415"]
# Lazy import of SceneMessage inside decode() breaks a codec↔message cycle
"src/punt_lux/protocol/messages/scene_codec.py" = ["PLC0415"]
# Native serialization for Hub→Display element transport (trusted IPC)
"src/punt_lux/protocol/messages/pickled_element_codec.py" = ["S301"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pydoclint]
style = "google"
arg-type-hints-in-docstring = false
skip-checking-short-docstrings = false
allow-init-docstring = true
check-style-mismatch = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.isort]
known-first-party = ["punt_lux"]
combine-as-imports = true

[tool.mypy]
mypy_path = "typings"
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
enable_error_code = ["ignore-without-code"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[[tool.mypy.overrides]]
module = [
    "imgui_bundle.*",
    "OpenGL.*",
    "typer.*",
    "setproctitle.*",
    "starlette.*",
    "uvicorn.*",
    "mcp.*",
    "fastmcp.*",
    "numpy.*",
    "PIL.*",
    # boto3 ships no py.typed marker/stubs of its own (its client objects are
    # generated at runtime from AWS's service model); AwsPrivateCaProvider.connect
    # only ever assigns the untyped client into the package's own _AcmPcaClient
    # Protocol, so Any-typed boto3 is sufficient without adding boto3-stubs.
    "boto3.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["punt_lux.display", "punt_lux.display.*"]
warn_unused_ignores = false
ignore_missing_imports = true

[tool.pyright]
stubPath = "typings"
pythonVersion = "3.13"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
include = ["src", "tests"]
reportMissingTypeStubs = false

[[tool.pyright.executionEnvironments]]
root = "src/punt_lux/tools"
reportPrivateUsage = false

[[tool.pyright.executionEnvironments]]
root = "tests/oo_coupling"
# Resolve top-level tools/ before the unrelated tests/tools/ package.
extraPaths = ["."]
reportPrivateUsage = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportUnknownMemberType = false

[[tool.pyright.executionEnvironments]]
root = "tests/test_python_docs.py"
extraPaths = ["."]

[[tool.pyright.executionEnvironments]]
root = "tests"
# The repo root, so a test importing a fixture from a sibling test package by its
# full path (`tests.rest._fakes`) resolves the same way pytest and mypy resolve
# it. Without it the root is `tests/` and only relative imports resolve.
extraPaths = ["."]
reportPrivateUsage = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportUnknownMemberType = false

