[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q -m 'not slow and not integration and not e2e'"
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow",
    "integration: marks integration tests (socket IPC, cross-component; no display process required)",
    "e2e: marks end-to-end tests requiring full stack",
    "gui: marks tests requiring a real ImGui window (GLFW init, display session)",
]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "*/test_*.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "def __str__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == \"__main__\":",
    "if TYPE_CHECKING:",
]
show_missing = true
precision = 2
