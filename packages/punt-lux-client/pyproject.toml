[project]
name = "punt-lux-client"
version = "0.33.1"
description = "Headless Lux client, wire contracts, kernel and applet helpers."
requires-python = ">=3.13"
license = "MIT"
authors = [{ name = "Punt Labs" }]
dependencies = [
    "pydantic>=2.0.0,<3",
    "websockets>=16.0,<18",
    "punt-observe==0.1.1",
    "setproctitle>=1.3.0",
]

[build-system]
requires = ["uv_build>=0.9.14,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["punt_lux.kernel", "punt_lux.wire", "punt_lux.client", "punt_lux.applets"]
namespace = true
